      <stop offset="0.52" stop-color="#0a2545"/>
      <stop offset="1" stop-color="#04121f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#42a5f5"/>
